name: Update MoE thresholds

on:
  schedule:
    # 00:15 UTC daily. WG recomputes at 00:00 UTC; this leaves a 15 min buffer.
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-thresholds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch thresholds from Wargaming API
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
        run: |
          python build_thresholds.py --no-metadata --out public/thresholds.json

      - name: Sanity check output
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("public/thresholds.json"))
          for realm, block in d["realms"].items():
              n = len(block["thresholds"])
              print(f"{realm}: {n} vehicles, updated_at={block['updated_at']}")
              if n < 500:
                  sys.exit(f"FAIL: {realm} returned only {n} vehicles")
              t34 = block["thresholds"].get("1")
              if not t34 or not all(k in t34 for k in ("65", "85", "95")):
                  sys.exit(f"FAIL: {realm} missing expected percentiles on tank_id=1")
          print("sanity check passed")
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/thresholds.json
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Update MoE thresholds ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
