name: Update MoE thresholds

on:
  schedule:
    # 00:15 UTC daily. WG recomputes at 00:00 UTC; this leaves a 15 min buffer.
    # NOTE: GitHub delays scheduled runs under load — actual start is often
    # 5-30 min later. Harmless here, the data only changes once a day.
    - cron: '15 0 * * *'
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

permissions:
  contents: write           # required to commit the refreshed file

concurrency:
  group: update-thresholds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch thresholds from Wargaming API
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
        run: |
          python build_thresholds.py \
            --no-metadata \
            --out public/thresholds.json \
            --history-dir public/history \
            --snapshot-dir public/snapshots \
            --history-days 30

      - name: Sanity check output
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("public/thresholds.json"))
          for realm, block in d["realms"].items():
              n = len(block["thresholds"])
              print(f"{realm}: {n} vehicles, updated_at={block['updated_at']}")
              # Guard against a partial or empty response being published.
              if n < 500:
                  sys.exit(f"FAIL: {realm} returned only {n} vehicles")
              t34 = block["thresholds"].get("1")
              if not t34 or not all(k in t34 for k in ("65", "85", "95")):
                  sys.exit(f"FAIL: {realm} missing expected percentiles on tank_id=1")
          print("sanity check passed")
          EOF

      # The rolling history must persist between runs, so it lives in the repo.
      # Pages artifacts don't survive to the next run.
      #
      # This commit doubles as the keepalive: GitHub disables scheduled
      # workflows after 60 days with no commits on the default branch (which
      # also kills workflow_dispatch, so you can't manually recover without
      # re-enabling first). A daily commit means that never triggers.
      #
      # NOTE: git history is permanent. Trimming history_*.json to 30 days
      # removes old snapshots from the working tree but they remain recoverable
      # via git log. See ToU §9 in the research notes. To make the window
      # genuinely rolling, see the shallow-history note below.
      - name: Commit history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/history public/snapshots
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Update MoE history ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
